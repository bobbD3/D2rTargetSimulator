<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aim Trainer - Corner to Center</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
        height: 100vh;
      }

      #gameContainer {
        position: relative;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        display: none;
      }

      #gameContainer.active {
        display: block;
      }

      .target {
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle, #ff4757 0%, #ff6348 100%);
        border: 4px solid white;
        box-shadow:
          0 0 20px rgba(255, 71, 87, 0.8),
          0 0 40px rgba(255, 71, 87, 0.4);
        cursor: grab;
        transition: transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        color: white;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        user-select: none;
      }

      .target:hover {
        transform: scale(1.1);
      }

      .target.center {
        background: radial-gradient(circle, #1e90ff 0%, #4169e1 100%);
        box-shadow:
          0 0 20px rgba(30, 144, 255, 0.8),
          0 0 40px rgba(30, 144, 255, 0.4);
      }

      #hud {
        position: fixed;
        top: 120px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        padding: 20px 40px;
        border-radius: 15px;
        color: white;
        font-size: 18px;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        display: flex;
        gap: 30px;
        align-items: center;
      }

      .hud-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .hud-label {
        font-size: 12px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .hud-value {
        font-size: 24px;
        font-weight: bold;
        color: #4ecca3;
      }

      #controls {
        position: fixed;
        top: 80px;
        right: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 20px;
        border-radius: 15px;
        color: white;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        min-width: 200px;
        transition: all 0.3s ease;
      }

      #controls.minimized {
        top: auto;
        bottom: 20px;
        right: 20px;
        padding: 10px 15px;
        min-width: auto;
      }

      #controls.minimized .control-content {
        display: none;
      }

      #controlsToggle {
        background: none;
        border: none;
        color: #4ecca3;
        cursor: pointer;
        font-size: 20px;
        padding: 5px;
        margin: 0;
        width: auto;
        display: inline-block;
      }

      #controlsToggle:hover {
        transform: scale(1.1);
      }

      #controls.minimized #controlsToggle {
        font-size: 24px;
      }

      .controls-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      #controls.minimized .controls-header {
        margin-bottom: 0;
      }

      #controls h3 {
        margin-bottom: 15px;
        color: #4ecca3;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .control-group {
        margin-bottom: 20px;
      }

      .control-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #ccc;
      }

      input[type='range'] {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: #555;
        outline: none;
        -webkit-appearance: none;
      }

      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #4ecca3;
        cursor: pointer;
      }

      input[type='range']::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #4ecca3;
        cursor: pointer;
        border: none;
      }

      .value-display {
        display: inline-block;
        float: right;
        color: #4ecca3;
        font-weight: bold;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: #4ecca3;
        border: none;
        border-radius: 8px;
        color: #222;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      button:hover {
        background: #45b393;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(78, 204, 163, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      .screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.95);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        z-index: 2000;
      }

      .screen.active {
        display: flex;
      }

      .screen h1 {
        font-size: 48px;
        margin-bottom: 20px;
        color: #4ecca3;
        text-shadow: 0 0 20px rgba(78, 204, 163, 0.5);
      }

      .screen p {
        font-size: 18px;
        margin-bottom: 30px;
        color: #ccc;
        text-align: center;
        max-width: 600px;
        line-height: 1.6;
      }

      .big-button {
        padding: 20px 60px;
        font-size: 20px;
        background: #4ecca3;
        border: none;
        border-radius: 12px;
        color: #222;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 2px;
        box-shadow: 0 4px 20px rgba(78, 204, 163, 0.4);
      }

      .big-button:hover {
        background: #45b393;
        transform: translateY(-4px);
        box-shadow: 0 8px 30px rgba(78, 204, 163, 0.6);
      }

      #stats {
        margin-top: 30px;
        font-size: 24px;
      }

      .stat-line {
        margin: 10px 0;
      }

      #hitMarker {
        position: fixed;
        width: 40px;
        height: 40px;
        pointer-events: none;
        z-index: 999;
        opacity: 0;
        transition: opacity 0.2s;
      }

      #hitMarker::before,
      #hitMarker::after {
        content: '';
        position: absolute;
        background: white;
      }

      #hitMarker::before {
        width: 100%;
        height: 2px;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
      }

      #hitMarker::after {
        width: 2px;
        height: 100%;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
      }

      #hitMarker.show {
        opacity: 1;
      }

      #dropZone {
        position: fixed;
        width: 200px;
        height: 200px;
        border: 3px dashed rgba(78, 204, 163, 0.5);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 500;
        transition: all 0.3s ease;
      }

      #dropZone.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="startScreen" class="screen active">
      <h1>🎯 AIM TRAINER</h1>
      <p>
        Drag targets from corners/edges to the center drop zone for 100
        rounds.<br />
        Adjust speed and target size in the controls panel.<br />
        Toggle mouse button to practice with left or right click!
      </p>
      <button class="big-button" id="startBtn">START TRAINING</button>
    </div>

    <div id="endScreen" class="screen">
      <h1>🏆 TRAINING COMPLETE</h1>
      <div id="stats"></div>
      <button class="big-button" id="restartBtn">TRAIN AGAIN</button>
    </div>

    <div id="gameContainer">
      <div id="dropZone"></div>
      <div id="hud">
        <div class="hud-item">
          <div class="hud-label">Round</div>
          <div class="hud-value" id="roundDisplay">1/100</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">Score</div>
          <div class="hud-value" id="scoreDisplay">0</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">Avg Time</div>
          <div class="hud-value" id="avgTimeDisplay">0.00s</div>
        </div>
      </div>

      <div id="controls">
        <div class="controls-header">
          <h3>⚙️ Controls</h3>
          <button id="controlsToggle">▼</button>
        </div>
        <div class="control-content">
          <div class="control-group">
            <label>
              Mouse Button
              <span class="value-display" id="mouseButtonValue">LEFT</span>
            </label>
            <button id="mouseToggleBtn" style="margin-top: 0">
              Toggle Mouse Button
            </button>
          </div>
          <div class="control-group">
            <label>
              Drop Zone
              <span class="value-display" id="dropZoneVisibility">VISIBLE</span>
            </label>
            <button id="dropZoneToggleBtn" style="margin-top: 0">
              Toggle Visibility
            </button>
          </div>
          <div class="control-group">
            <label>
              Drop Zone Size
              <span class="value-display" id="dropZoneSizeValue">200px</span>
            </label>
            <input
              type="range"
              id="dropZoneSizeSlider"
              min="100"
              max="400"
              step="25"
              value="200"
            />
          </div>

          <div class="control-group">
            <label>
              Target Size
              <span class="value-display" id="sizeValue">60px</span>
            </label>
            <input
              type="range"
              id="sizeSlider"
              min="30"
              max="100"
              step="5"
              value="60"
            />
          </div>
          <button id="pauseBtn">Pause Game</button>
        </div>
      </div>
    </div>

    <div id="hitMarker"></div>

    <script>
      let game = {
        active: false,
        round: 0,
        maxRounds: 100,
        score: 0,
        startTime: 0,
        times: [],
        targetSize: 60,
        isPaused: false,
        mouseButton: 0, // 0 = left, 2 = right
        isDragging: false,
        dragTarget: null,
        dragOffsetX: 0,
        dragOffsetY: 0,
        dropZoneSize: 200,
        dropZoneVisible: true,
      };

      const positions = {
        // Generate random positions around the perimeter
        getRandomEdgePosition: function () {
          const margin = 0.1; // 10% margin from edges
          const side = Math.floor(Math.random() * 4);

          switch (side) {
            case 0: // Top edge
              return {
                x: margin + Math.random() * (1 - 2 * margin),
                y: margin,
              };
            case 1: // Right edge
              return {
                x: 1 - margin,
                y: margin + Math.random() * (1 - 2 * margin),
              };
            case 2: // Bottom edge
              return {
                x: margin + Math.random() * (1 - 2 * margin),
                y: 1 - margin,
              };
            case 3: // Left edge
              return {
                x: margin,
                y: margin + Math.random() * (1 - 2 * margin),
              };
          }
        },
        center: { x: 0.5, y: 0.5 },
      };

      // Prevent context menu on right click for entire game container
      document
        .getElementById('gameContainer')
        .addEventListener('contextmenu', function (e) {
          e.preventDefault();
          return false;
        });

      // Global mousemove for dragging
      document.addEventListener('mousemove', function (e) {
        if (!game.isDragging || !game.dragTarget) return;

        // Update target position to follow mouse
        const size = game.targetSize;
        game.dragTarget.style.left =
          e.clientX - game.dragOffsetX - size / 2 + 'px';
        game.dragTarget.style.top =
          e.clientY - game.dragOffsetY - size / 2 + 'px';
      });

      // Global mouseup for drop detection
      document.addEventListener('mouseup', function (e) {
        if (!game.isDragging || !game.dragTarget) return;

        // Check if correct mouse button was released
        if (e.button !== game.mouseButton) return;

        game.isDragging = false;
        game.dragTarget.style.cursor = 'pointer';

        // Check if dropped near center
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distance = Math.sqrt(
          Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2),
        );

        // Use half of drop zone size as radius
        const dropZoneRadius = game.dropZoneSize / 2;

        if (distance <= dropZoneRadius) {
          // Success! Completed the drag
          const time = (Date.now() - game.startTime) / 1000;
          game.times.push(time);
          game.score += Math.max(0, 100 - Math.floor(time * 10));

          showHitMarker(e.clientX, e.clientY);
          game.dragTarget = null;
          nextRound();
        } else {
          // Dropped outside center - snap back to original position
          game.dragTarget = null;
        }
      });

      // Start button
      document
        .getElementById('startBtn')
        .addEventListener('click', function () {
          document.getElementById('startScreen').classList.remove('active');
          document.getElementById('gameContainer').classList.add('active');

          game = {
            active: true,
            round: 0,
            maxRounds: 100,
            score: 0,
            startTime: 0,
            times: [],
            targetSize: 60,
            isPaused: false,
            mouseButton: 0,
            isDragging: false,
            dragTarget: null,
            dragOffsetX: 0,
            dragOffsetY: 0,
            dropZoneSize: 200,
            dropZoneVisible: true,
          };

          nextRound();
        });

      // Restart button
      document
        .getElementById('restartBtn')
        .addEventListener('click', function () {
          document.getElementById('endScreen').classList.remove('active');
          document.getElementById('startScreen').classList.add('active');
          document.getElementById('gameContainer').classList.remove('active');
        });

      // Controls toggle
      document
        .getElementById('controlsToggle')
        .addEventListener('click', function () {
          const controls = document.getElementById('controls');
          const isMinimized = controls.classList.toggle('minimized');
          this.textContent = isMinimized ? '▲' : '▼';
        });

      // Drop zone visibility toggle
      document
        .getElementById('dropZoneToggleBtn')
        .addEventListener('click', function () {
          game.dropZoneVisible = !game.dropZoneVisible;
          const dropZone = document.getElementById('dropZone');
          if (game.dropZoneVisible) {
            dropZone.classList.remove('hidden');
            document.getElementById('dropZoneVisibility').textContent =
              'VISIBLE';
          } else {
            dropZone.classList.add('hidden');
            document.getElementById('dropZoneVisibility').textContent =
              'HIDDEN';
          }
        });

      // Drop zone size control
      document
        .getElementById('dropZoneSizeSlider')
        .addEventListener('input', function (e) {
          game.dropZoneSize = parseInt(e.target.value);
          document.getElementById('dropZoneSizeValue').textContent =
            game.dropZoneSize + 'px';
          const dropZone = document.getElementById('dropZone');
          dropZone.style.width = game.dropZoneSize + 'px';
          dropZone.style.height = game.dropZoneSize + 'px';
        });

      // Mouse button toggle
      document
        .getElementById('mouseToggleBtn')
        .addEventListener('click', function () {
          game.mouseButton = game.mouseButton === 0 ? 2 : 0;
          document.getElementById('mouseButtonValue').textContent =
            game.mouseButton === 0 ? 'LEFT' : 'RIGHT';
        });

      // Pause button
      document
        .getElementById('pauseBtn')
        .addEventListener('click', function () {
          game.isPaused = !game.isPaused;
          const btn = document.getElementById('pauseBtn');
          if (game.isPaused) {
            btn.textContent = 'Resume Game';
            btn.style.background = '#ff6348';
          } else {
            btn.textContent = 'Pause Game';
            btn.style.background = '#4ecca3';
          }
        });

      // Speed control
      document
        .getElementById('speedSlider')
        .addEventListener('input', function (e) {
          document.getElementById('speedValue').textContent =
            parseFloat(e.target.value).toFixed(1) + 'x';
        });

      // Size control
      document
        .getElementById('sizeSlider')
        .addEventListener('input', function (e) {
          game.targetSize = parseInt(e.target.value);
          document.getElementById('sizeValue').textContent =
            game.targetSize + 'px';

          const target = document.querySelector('.target');
          if (target) {
            target.style.width = game.targetSize + 'px';
            target.style.height = game.targetSize + 'px';
            target.style.fontSize = game.targetSize / 3 + 'px';
          }
        });

      function nextRound() {
        if (!game.active || game.round >= game.maxRounds) {
          endGame();
          return;
        }

        game.round++;
        updateHUD();
        spawnTarget();
        game.startTime = Date.now();
      }

      function spawnTarget() {
        const oldTarget = document.querySelector('.target');
        if (oldTarget) oldTarget.remove();

        const target = document.createElement('div');
        target.className = 'target';

        // Always spawn at edge/corner - never at center
        const pos = positions.getRandomEdgePosition();
        target.textContent = '○';

        const size = game.targetSize;
        target.style.width = size + 'px';
        target.style.height = size + 'px';
        target.style.fontSize = size / 3 + 'px';
        target.style.left = pos.x * window.innerWidth - size / 2 + 'px';
        target.style.top = pos.y * window.innerHeight - size / 2 + 'px';

        target.addEventListener('mousedown', function (e) {
          if (game.isPaused || !game.active) return;

          // Check if correct mouse button was clicked
          if (e.button !== game.mouseButton) return;

          game.isDragging = true;
          game.dragTarget = target;

          // Calculate offset so cursor stays where user clicked
          const rect = target.getBoundingClientRect();
          game.dragOffsetX = e.clientX - rect.left - rect.width / 2;
          game.dragOffsetY = e.clientY - rect.top - rect.height / 2;

          target.style.cursor = 'grabbing';
          e.preventDefault();
        });

        document.getElementById('gameContainer').appendChild(target);
      }

      function showHitMarker(x, y) {
        const marker = document.getElementById('hitMarker');
        marker.style.left = x - 20 + 'px';
        marker.style.top = y - 20 + 'px';
        marker.classList.add('show');
        setTimeout(() => marker.classList.remove('show'), 200);
      }

      function updateHUD() {
        document.getElementById('roundDisplay').textContent =
          `${game.round}/${game.maxRounds}`;
        document.getElementById('scoreDisplay').textContent = game.score;

        if (game.times.length > 0) {
          const avg = game.times.reduce((a, b) => a + b, 0) / game.times.length;
          document.getElementById('avgTimeDisplay').textContent =
            avg.toFixed(2) + 's';
        }
      }

      function endGame() {
        game.active = false;
        document.getElementById('gameContainer').classList.remove('active');
        document.getElementById('endScreen').classList.add('active');

        const avg = game.times.reduce((a, b) => a + b, 0) / game.times.length;
        const fastest = Math.min(...game.times);
        const slowest = Math.max(...game.times);

        document.getElementById('stats').innerHTML = `
                <div class="stat-line">Final Score: <strong style="color: #4ecca3">${game.score}</strong></div>
                <div class="stat-line">Average Time: <strong style="color: #4ecca3">${avg.toFixed(2)}s</strong></div>
                <div class="stat-line">Fastest: <strong style="color: #4ecca3">${fastest.toFixed(2)}s</strong></div>
                <div class="stat-line">Slowest: <strong style="color: #4ecca3">${slowest.toFixed(2)}s</strong></div>
            `;
      }
    </script>
  </body>
</html>
